name: Build macOS installers

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Xavi-Launcher-GitHub-Upload-fixed

jobs:
  macos:
    name: Build macOS ${{ matrix.arch }} installer
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Xavi-Launcher-GitHub-Upload-fixed/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare macOS icon
        run: sips -z 512 512 build/xavi-icon.png --out build/xavi-icon-mac.png

      - name: Build macOS DMG
        run: |
          npm pkg set build.mac.icon=build/xavi-icon-mac.png
          npm run build:mac -- --${{ matrix.arch }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: xavi-launcher-macos-${{ matrix.arch }}
          path: Xavi-Launcher-GitHub-Upload-fixed/dist/*.dmg
          if-no-files-found: error
