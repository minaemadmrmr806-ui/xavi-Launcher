name: Build macOS installer

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Xavi-Launcher-GitHub-Upload-fixed

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Xavi-Launcher-GitHub-Upload-fixed/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build universal macOS DMG
        run: npm run build:mac -- --universal

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: xavi-launcher-macos
          path: Xavi-Launcher-GitHub-Upload-fixed/dist/*.dmg
          if-no-files-found: error
